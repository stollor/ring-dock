[workspace]
members = [".", "crates/deskpin"]

[package]
name = "ring-dock"
version = "0.1.1"
edition = "2021"
description = "Windows 桌面圆环收纳工具 —— 半透明圆环象限收纳桌面图标，逐像素透明玻璃界面"

[dependencies]
deskpin = { path = "crates/deskpin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.61"
windows-numerics = "0.2"
windows-future = "0.2"

[dependencies.windows]
version = "0.61"
features = [
    "Foundation",
    "Foundation_Numerics",
    "Devices_Geolocation",
    "Win32_Foundation",
    "Win32_Devices_Geolocation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_WinRT",
    "Win32_Networking_WinHttp",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
]

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
