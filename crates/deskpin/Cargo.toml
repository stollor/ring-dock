[package]
name = "deskpin"
version = "0.1.0"
edition = "2021"
description = "Windows 桌面挂件「固定显示在桌面上」工具箱（无业务）：挂进桌面窗口树，不遮挡应用窗口、不受 Win+D / 最小化所有影响"

[dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
